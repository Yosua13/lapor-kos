name: CI & Security Release Gate

on:
  push:
    branches: [main, codex/*]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: Secret Scanning & Credential Checks (AC 1)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Secret Scanner
        run: go run ./scripts/ci/scan_secrets.go

  # ---------------------------------------------------------------------------
  # Gate 2: Database Migration Validation (AC 1)
  # ---------------------------------------------------------------------------
  migration-validation:
    name: Sequential Migration Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lapor_kos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Sequential Migration Validator
        env:
          TEST_DATABASE_URL: postgres://postgres:password123@localhost:5432/lapor_kos_test?sslmode=disable
        run: go run ./scripts/ci/validate_migrations.go

  # ---------------------------------------------------------------------------
  # Gate 3: Authorization, Multi-Tenant Isolation & Restore Drill (AC 1, AC 2)
  # ---------------------------------------------------------------------------
  backend-and-release-gates:
    name: Backend, Authz & Restore Drill Gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lapor_kos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Apply Migrations
        env:
          PGPASSWORD: password123
        run: |
          for file in $(ls -v backend/migrations/*.sql); do
            echo "Applying $file..."
            psql -h localhost -U postgres -d lapor_kos_test -f "$file"
          done

      - name: Run Backend Unit Tests
        run: |
          cd backend
          go test -v ./...

      - name: Run Cross-Owner Isolation & Security Integration Tests (AC 2)
        env:
          TEST_DATABASE_URL: postgres://postgres:password123@localhost:5432/lapor_kos_test?sslmode=disable
        run: |
          cd backend
          go test -tags=integration -v -run "TestSecurityAuditAndObservabilityLifecycle|TestPropertyFinanceReconciliationAndLifecycle|TestRuleVersioningAndAcknowledgmentLifecycle" ./internal/repository

      - name: Run Backup & Restore Drill Release Gate (AC 2)
        env:
          TEST_DATABASE_URL: postgres://postgres:password123@localhost:5432/lapor_kos_test?sslmode=disable
        run: go run ./scripts/ci/backup_restore_drill.go

  # ---------------------------------------------------------------------------
  # Gate 4: Frontend Typecheck, Vitest, and Production Build (AC 1, AC 5)
  # ---------------------------------------------------------------------------
  frontend-gate:
    name: Frontend Typecheck, Tests, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Vitest Unit & Component Tests
        run: |
          cd frontend
          npm test

      - name: Run Frontend Production Build
        run: |
          cd frontend
          npm run build

  # ---------------------------------------------------------------------------
  # Gate 5: Release Artifact Check (AC 5)
  # ---------------------------------------------------------------------------
  release-artifact-check:
    name: Release Artifact Inspection (AC 5)
    runs-on: ubuntu-latest
    needs: [secret-scan, migration-validation, backend-and-release-gates, frontend-gate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Release Artifact Validator
        run: go run ./scripts/ci/check_release_artifacts.go
